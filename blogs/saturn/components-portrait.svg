<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1580" viewBox="0 0 720 1580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d"><title id="t">A running Saturn, part 1 of 2: the parents&#x27; home and the cloud, steps 1 to 3</title><desc id="d">A running Saturn drawn as four places: the parents&#x27; home with two phones; the cloud with a Telegram group, a Worker (verify, store, copy media) holding an inbox and a media store, and GitHub holding three repositories and the Actions jobs (nightly batch, hourly integrity check); the owner&#x27;s home with a home server (site builder, voice review, loop job and queue, dead-man check), a Mac transcription runner, the owner&#x27;s phone and a bell, inside a fenced private network; and the doctor who receives a printed packet. One amber path, numbered 1 to 6 with a verb on each line, runs from the phones to the doctor. Four lock chips state policies. No personal data, hostnames or names.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8C5B16"/></marker></defs><rect width="720" height="1580" fill="#F3F6EF"/><rect x="20" y="20" width="680" height="280" rx="26" fill="#EAEEE4"/>
