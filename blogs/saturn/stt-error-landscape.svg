<title id="t">Merging two engines cut word error to 0.22, but twice it said more than she did</title>
<desc id="d">Lollipop dot plot, one row per speech-to-text engine over the same three Hindi voice notes, latest scored row: word error rate as the dot position, with key terms found and claims judged wrong beside each: LLM merge of both WER 0.22, terms 24/28, wrong 1; whisper.cpp, Mac WER 0.27, terms 24/28, wrong 3; whisper.cpp, CPU runner WER 0.31, terms 22/28, wrong 5; MMS Hindi, Mac WER 0.55, terms 16/28, wrong 1. Lower error is better. Source eval/stt-results.ndjson. No audio content shown.</desc>
