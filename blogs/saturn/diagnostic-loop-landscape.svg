<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">The diagnostic loop: seven seats, one inference record</title>
<desc id="d">Left: facts from the knowledge base enter a panel of seven fixed seats (hypothesis, test chooser, challenger, stewardship, checklist, a blinded seat, a citation verifier). Every claim passes the verifier before it is written to an inference record holding a claim, a probability, the ids of the evidence and the label agent-inferred, which the status page shows. The loop never writes to the facts. Panel structure after Microsoft Research&#x27;s MAI-DxO (Nori et al., 2025); Saturn adopts its structure, not its accuracy figures. Synthetic content only.</desc>
