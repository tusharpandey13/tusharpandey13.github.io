<text x="40" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#646861" text-anchor="start" dominant-baseline="middle">Structure after Microsoft Research&#x27;s MAI-DxO. The loop reads facts; it never edits them.</text>
