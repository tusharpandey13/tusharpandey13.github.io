<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">The knowledge base: source, fact, ref, supersede</title>
<desc id="d">Three columns left to right: a source (one document, photo or voice note) yields facts of four kinds (observation, medication, condition, event); facts point at refs of three kinds (drug, code, party). Below, a correction is shown as a new fact row that supersedes the old one, which is kept and marked superseded. Synthetic ids only.</desc>
<defs><marker id="arr-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171816"/></marker><marker id="arr-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007197"/></marker></defs>
<rect width="1200" height="560" fill="#F3F6EF"/>
