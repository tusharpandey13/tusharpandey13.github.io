<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1540" width="720" height="1540" role="img" aria-labelledby="t d">
<title id="t">Saturn pipeline: from a family phone to a private site (portrait)</title>
<desc id="d">Seven numbered steps stacked top to bottom: family phone, Telegram group, Worker storing rows and media, nightly batch, git knowledge base, generated pages, private site. Solid arrows are data moving; the dashed blue arrow is the nightly timer. Side jobs are in a second diagram. No personal data.</desc>
