<rect width="720" height="1540" fill="#F3F6EF"/>
<text x="40" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#1F211E" text-anchor="start" dominant-baseline="middle" font-weight="700">One loop, once a night</text>
<path d="M 40 110 L 100 110" fill="none" stroke="#171816" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-data)"/>
<text x="114" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#646861" text-anchor="start" dominant-baseline="middle">data moves</text>
