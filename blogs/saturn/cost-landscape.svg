<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d">
<title id="t">One loop run costs as much as 15 months of running everything else</title>
<desc id="d">Three figures: fixed cost $0, running cost about $0.80 a month, diagnostic loop capped at $12 a run and started by hand. Below, 15 small blue blocks of one month&#x27;s running cost laid against one amber block for a single loop run of the same total length. Source: the owner&#x27;s bills.</desc>
<defs><marker id="arr-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171816"/></marker><marker id="arr-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007197"/></marker></defs>
