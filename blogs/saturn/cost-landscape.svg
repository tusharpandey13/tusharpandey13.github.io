<text x="40" y="83.2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#646861" text-anchor="start" dominant-baseline="middle">Fixed cost, monthly running cost, and the per-run cap on the diagnostic loop, which runs only when asked.</text>
