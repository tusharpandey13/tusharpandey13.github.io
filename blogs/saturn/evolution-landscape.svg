<title id="t">The first two weeks: system events, 27 Oct to 7 Nov 2026</title>
<desc id="d">A horizontal timeline from 27 October to 7 November 2026 with seven system events: went live and bot leaves the family group (27 Oct); local Hindi transcription (31 Oct); term list feeds the model and voice review page (4 Nov); Run-the-loop button and endpoint lockdown (5 Nov). No medical events, no personal data.</desc>
