<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Saturn pipeline: from a family phone to a private site</title>
<desc id="d">Seven numbered steps left to right: family phone, Telegram group, Cloudflare Worker storing rows in D1 and media in R2, the nightly batch, the git knowledge base, generated pages, the private site. Solid arrows are data moving; dashed blue arrows are triggers. Three side jobs sit below: Mac transcription feeding the batch, a voice review page and a Run-the-loop button that both write back to the knowledge base. No personal data.</desc>
