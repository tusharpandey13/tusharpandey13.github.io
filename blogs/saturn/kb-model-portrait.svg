<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1330" width="720" height="1330" role="img" aria-labelledby="t d">
<title id="t">The knowledge base: source, fact, ref, supersede (portrait)</title>
<desc id="d">Stacked: a source yields facts of four kinds (observation, medication, condition, event); facts name refs of three kinds (drug, code, party). Below, a correction is a new fact row that supersedes the old one; the old row is kept. Synthetic ids only.</desc>
