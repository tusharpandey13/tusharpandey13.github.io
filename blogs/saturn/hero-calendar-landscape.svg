<title id="t">Hero: ninety days between two visits</title>
<desc id="d">A calendar strip of thirteen weeks drawn as columns. Two days are marked as doctor visits, at the start and the end. Every day between carries small marks for things that happened at home. Synthetic; no dates, no values.</desc>
