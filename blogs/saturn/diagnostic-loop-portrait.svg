<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1500" width="720" height="1500" role="img" aria-labelledby="t d">
<title id="t">The diagnostic loop: seven seats, one inference record (portrait)</title>
<desc id="d">Stacked: knowledge-base facts (read only) enter a panel of seven fixed seats; the citation verifier is the last seat; the output is an inference record with claim, probability, evidence ids, the label agent-inferred and a dated prediction; the status page shows it. Panel structure after Microsoft Research&#x27;s MAI-DxO (Nori et al., 2025); Saturn adopts the structure, not the accuracy figures. Synthetic content only.</desc>
