<title id="t">One loop run costs as much as 15 months of running everything else</title>
<desc id="d">Three figures: fixed cost $0, running cost about $0.80 a month, diagnostic loop capped at $12 a run and started by hand. Below, 15 small blue blocks of one month&#x27;s running cost laid against one amber block for a single loop run of the same total length. Source: the owner&#x27;s bills.</desc>
