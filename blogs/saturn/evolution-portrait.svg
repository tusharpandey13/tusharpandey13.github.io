<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1500" width="720" height="1500" role="img" aria-labelledby="t d">
<title id="t">The first two weeks: system events, 27 Oct to 7 Nov 2026 (portrait)</title>
<desc id="d">A vertical timeline, dates down the left, seven system events: went live and bot leaves the family group (27 Oct); local Hindi transcription (31 Oct); term list feeds the model and voice review page (4 Nov); Run-the-loop button and endpoint lockdown (5 Nov). No medical events, no personal data.</desc>
