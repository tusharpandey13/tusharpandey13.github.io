<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1150" width="720" height="1150" role="img" aria-labelledby="t d">
<title id="t">Three repositories, three contracts (portrait)</title>
<desc id="d">Three boxes stacked: Product (public code), Environment (private, pins what runs), Records (private, the family&#x27;s data). Between them the three contract files: env.manifest and product.lock between product and environment, records.yaml between records and environment. No personal data.</desc>
<defs><marker id="arr-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171816"/></marker><marker id="arr-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007197"/></marker></defs>
<rect width="720" height="1150" fill="#F3F6EF"/>
<text x="40" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#1F211E" text-anchor="start" dominant-baseline="middle" font-weight="700">Three repos, three contracts</text>
<text x="40" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#646861" text-anchor="start" dominant-baseline="middle">Code is public. Where it runs</text>
<text x="40" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#646861" text-anchor="start" dominant-baseline="middle">and what it holds are not.</text>
