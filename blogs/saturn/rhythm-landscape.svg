<title id="t">The family sends at lunchtime; the digest lands after 1 am</title>
<desc id="d">A 24-hour ring, one radial bar per hour of the day in IST, counting when the family&#x27;s 41 Telegram messages arrived over 27 Oct to 5 Nov 2026: 07:00 1; 08:00 3; 09:00 3; 10:00 3; 11:00 5; 13:00 12; 14:00 6; 16:00 3; 19:00 2; 20:00 2; 21:00 1. An amber arc marks when the nightly digest went out, 01:44 to 03:50 IST over 9 digests, scheduled for 21:07 and delayed by the CI queue. Counts only. Source data/telegram.</desc>
