<text x="385.0" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#646861" text-anchor="middle" dominant-baseline="middle">what it needs</text>
<path d="M 470 296 L 300 296" fill="none" stroke="#171816" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-data)"/>
<text x="385.0" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#171816" text-anchor="middle" dominant-baseline="middle">product.lock</text>
<text x="385.0" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#646861" text-anchor="middle" dominant-baseline="middle">pinned version</text>
<path d="M 900 260.0 L 730 260.0" fill="none" stroke="#171816" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-data)"/>
<text x="815.0" y="220.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#171816" text-anchor="middle" dominant-baseline="middle">records.yaml</text>
<text x="815.0" y="242.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#646861" text-anchor="middle" dominant-baseline="middle">where data lives</text>
<rect x="40" y="380" width="1120" height="70" rx="14" fill="#ECE7D8" stroke="none"/>
<text x="600" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#1F211E" text-anchor="middle" dominant-baseline="middle">deployment = product (pinned) + environment (secrets, hosts) + records (data)</text>
