<circle cx="921.6" cy="269.6" r="3.2" fill="#646861"/>
<circle cx="935.04" cy="256.8" r="3.2" fill="#646861"/>
<path d="M 921.6 250.4 V 269.6 M 935.04 256.8 q 0 8.0 -13.44 9.6" fill="none" stroke="#646861" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1049.0" y="249.8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#1F211E" text-anchor="middle" dominant-baseline="middle" font-weight="600">Records</text>
<text x="1049.0" y="272.65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#646861" text-anchor="middle" dominant-baseline="middle">the family&#x27;s data</text>
