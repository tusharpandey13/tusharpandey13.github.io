<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Diagnostic-loop panel</title>
  <desc id="desc">Seats Hypothesis, Test-chooser, Challenger, Stewardship and Checklist, plus a blinded seat, draft an inference; a citation verifier checks every cited fact; the output is an inference record with a probability and its evidence.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc16a"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc16a"/></marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0c9a5" fill-opacity="0.6"/></marker>
  </defs>
  <rect width="1200" height="620" rx="20" fill="#110e09"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15">
    <text x="600" y="46" text-anchor="middle" fill="#e0c9a5" font-size="22" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">The diagnostic loop: seven seats, one record</text>
    <rect x="40" y="110" width="184" height="80" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="132.0" y="145" text-anchor="middle" fill="#e0c9a5" font-size="12">Hypothesis</text>
    <text x="132.0" y="164" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">what could explain the facts</text>
    <path d="M132,190 L132,230" fill="none" stroke="#e0c9a5" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="230" y="110" width="184" height="80" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="322.0" y="145" text-anchor="middle" fill="#e0c9a5" font-size="12">Test-chooser</text>
    <text x="322.0" y="164" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">which test would move it</text>
    <path d="M322,190 L322,230" fill="none" stroke="#e0c9a5" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="420" y="110" width="184" height="80" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="512.0" y="145" text-anchor="middle" fill="#e0c9a5" font-size="12">Challenger</text>
    <text x="512.0" y="164" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">argue the other way</text>
    <path d="M512,190 L512,230" fill="none" stroke="#e0c9a5" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="610" y="110" width="184" height="80" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="702.0" y="145" text-anchor="middle" fill="#e0c9a5" font-size="12">Stewardship</text>
    <text x="702.0" y="164" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">cost, burden, what to skip</text>
    <path d="M702,190 L702,230" fill="none" stroke="#e0c9a5" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="800" y="110" width="184" height="80" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="892.0" y="145" text-anchor="middle" fill="#e0c9a5" font-size="12">Checklist</text>
    <text x="892.0" y="164" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">what is still unasked</text>
    <path d="M892,190 L892,230" fill="none" stroke="#e0c9a5" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M132,230 L1085,230" fill="none" stroke="#e0c9a5" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M600,230 L600,262" fill="none" stroke="#e0c9a5" stroke-opacity="0.6" stroke-width="1.5" marker-end="url(#ahm)"/>
    <rect x="1000" y="110" width="170" height="80" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#7fc16a" stroke-dasharray="6 4"/>
    <text x="1085.0" y="145" text-anchor="middle" fill="#e0c9a5" font-size="12">blinded seat</text>
    <text x="1085.0" y="164" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">sees facts, not the others</text>
    <path d="M1085,190 L1085,230" fill="none" stroke="#e0c9a5" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="1016" y1="150" x2="1154" y2="150" stroke="#7fc16a" stroke-width="2" opacity="0.35"/>
    <rect x="430" y="266" width="340" height="64" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="600.0" y="292" text-anchor="middle" fill="#e0c9a5" font-size="14">draft inference</text>
    <text x="600.0" y="313" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="14">claim + probability + cited fact ids</text>
    <path d="M600,330 L600,372" fill="none" stroke="#7fc16a" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="430" y="376" width="340" height="64" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#7fc16a"/>
    <text x="600.0" y="402" text-anchor="middle" fill="#e0c9a5" font-size="14">citation verifier</text>
    <text x="600.0" y="423" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="14">each id exists and says what is claimed</text>
    <path d="M770,408 L980,408 L980,298 L776,298" fill="none" stroke="#7fc16a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah2)"/>
    <text x="992" y="350" text-anchor="start" fill="#7fc16a" font-size="12">bad cite:</text>
    <text x="992" y="368" text-anchor="start" fill="#e0c9a5" fill-opacity="0.62" font-size="11">back to draft</text>
    <path d="M600,440 L600,482" fill="none" stroke="#7fc16a" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="330" y="486" width="540" height="96" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#7fc16a"/>
    <text x="600" y="512" text-anchor="middle" fill="#e0c9a5" font-size="16" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">inference record</text>
    <text x="600" y="538" text-anchor="middle" fill="#e0c9a5" font-size="14">agent-inferred · p 40% (25–60%) · evidence: 6 fact ids · next test named</text>
    <text x="600" y="562" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13">shown on the Status page, labelled; never a diagnosis</text>
    <text x="600" y="606" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">Facts as written; not advice; doctors decide.</text>
  </g>
</svg>
