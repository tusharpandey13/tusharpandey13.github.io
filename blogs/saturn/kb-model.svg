<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge-base model</title>
  <desc id="desc">A source row points to facts (observation, medication, condition, event); facts point to refs (drug, code, party). Corrections only by a new row that supersedes the old one. One synthetic example row.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc16a"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc16a"/></marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0c9a5" fill-opacity="0.6"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#110e09"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15">
    <text x="600" y="46" text-anchor="middle" fill="#e0c9a5" font-size="22" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">Knowledge base: source → fact → ref</text>
    <rect x="60" y="110" width="260" height="150" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="190" y="146" text-anchor="middle" fill="#e0c9a5" font-size="20" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">source</text>
    <text x="190" y="178" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13">one scan, photo or voice note</text>
    <text x="190" y="202" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13">path, date, who wrote it</text>
    <text x="190" y="226" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ns:src:&lt;date&gt;-&lt;facility&gt;-&lt;what&gt;</text>
    <path d="M320,185 L436,185" fill="none" stroke="#7fc16a" stroke-width="2" marker-end="url(#ah)"/>
    <text x="378" y="174" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">1 : n</text>
    <rect x="440" y="110" width="320" height="150" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="600" y="146" text-anchor="middle" fill="#e0c9a5" font-size="20" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">fact</text>
    <text x="600" y="178" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13">observation · medication</text>
    <text x="600" y="202" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13">condition · event</text>
    <text x="600" y="226" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13">value as written, verification level</text>
    <path d="M760,185 L876,185" fill="none" stroke="#7fc16a" stroke-width="2" marker-end="url(#ah)"/>
    <text x="818" y="174" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">n : 1</text>
    <rect x="880" y="110" width="260" height="150" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="1010" y="146" text-anchor="middle" fill="#e0c9a5" font-size="20" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">ref</text>
    <text x="1010" y="178" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13">drug · code · party</text>
    <text x="1010" y="202" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13">shared vocabulary</text>
    <text x="1010" y="226" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ref:drug:&lt;name&gt;</text>
    <text x="60" y="318" text-anchor="start" fill="#e0c9a5" font-size="16" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">corrections</text>
    <rect x="60" y="336" width="280" height="70" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="muted"/>
    <text x="200.0" y="365" text-anchor="middle" fill="#e0c9a5" font-size="14">fact v1</text>
    <text x="200.0" y="386" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="14">status: superseded</text>
    <rect x="440" y="336" width="280" height="70" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#7fc16a"/>
    <text x="580.0" y="365" text-anchor="middle" fill="#e0c9a5" font-size="14">fact v2</text>
    <text x="580.0" y="386" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="14">supersedes: v1</text>
    <path d="M440,371 L344,371" fill="none" stroke="#7fc16a" stroke-width="2" marker-end="url(#ah2)"/>
    <text x="392" y="360" text-anchor="middle" fill="#7fc16a" font-size="12">supersedes</text>
    <text x="780" y="362" text-anchor="start" fill="#e0c9a5" fill-opacity="0.62" font-size="14">rows are never edited or deleted;</text>
    <text x="780" y="384" text-anchor="start" fill="#e0c9a5" fill-opacity="0.62" font-size="14">a fix is a new row and a link back. Git keeps the rest.</text>
    <text x="60" y="452" text-anchor="start" fill="#e0c9a5" font-size="16" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600">example row (synthetic)</text>
    <rect x="60" y="466" width="1080" height="92" rx="10" fill="#e0c9a5" fill-opacity="0.05" stroke="#e0c9a5" stroke-opacity="0.35"/>
    <text x="80" y="500" text-anchor="start" fill="#e0c9a5" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{"id":"demo:fact:2026-01-01-clinic-bp.systolic", "kind":"observation", "source":"demo:src:2026-01-01-clinic-bp",</text>
    <text x="80" y="526" text-anchor="start" fill="#e0c9a5" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"> "data":{"value":118, "unit":"mmHg", "code":"ref:code:loinc-8480-6"}, "verification":"human", "status":"active"}</text>
    <text x="600" y="584" text-anchor="middle" fill="#e0c9a5" fill-opacity="0.62" font-size="12">Facts as written; not advice; doctors decide.</text>
  </g>
</svg>
