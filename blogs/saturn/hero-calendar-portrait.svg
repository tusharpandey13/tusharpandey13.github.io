<title id="t">Hero: ninety days between two visits</title>
<desc id="d">A calendar grid of thirteen weeks. Two days are marked as doctor visits, at the start and the end. Every day between carries small marks for things that happened at home: a reading, a voice note, a medicine strip. Synthetic; no dates, no values.</desc>
