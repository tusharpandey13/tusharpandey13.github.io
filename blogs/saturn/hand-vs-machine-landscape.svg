<title id="t">Hand work halved in week two: 36 commits to 17</title>
<desc id="d">Slope chart, records-repo commits: by hand week 1 (27 Oct to 2 Nov) 36 to week 2 (3 to 7 Nov) 17; by machine 21 to 12. Machine = the nightly batch and voice-review signers. Commit counts are a proxy for where the owner&#x27;s time went, not hours. Source: git log.</desc>
