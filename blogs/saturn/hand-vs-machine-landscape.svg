<text x="40" y="83.2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#646861" text-anchor="start" dominant-baseline="middle">Commits to the records repo by the owner (by hand) and by the nightly batch and signers (by machine). A proxy, not a clock.</text>
