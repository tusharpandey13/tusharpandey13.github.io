<text x="54" y="420.15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#171816" text-anchor="start" dominant-baseline="middle">Both fell, and week 2 is five days to week 1&#x27;s seven. The share by machine held at about 40%.</text>
