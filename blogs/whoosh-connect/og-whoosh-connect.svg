<title id="t">whoosh-connect — Zwift Click shifters, without Zwift</title>
<desc id="d">Share image. Two BLE pucks on the bike, one offline process on the Mac, and MyWhoosh on the other side of one OpenBikeControl device. No Zwift, no account, no daily unlock.</desc>
