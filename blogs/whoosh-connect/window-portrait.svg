<text x="78" y="169.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#808f8f" text-anchor="end" font-weight="400">20s</text>
<line x1="86" y1="282" x2="96" y2="282" stroke="#454e4e" stroke-width="1.4"/>
