<text x="860.0" y="121" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="20" fill="#808f8f" text-anchor="middle" font-weight="400">silent</text>
<line x1="90" y1="56" x2="90" y2="82" stroke="#7ec98b" stroke-width="2"/>
<circle cx="90" cy="82" r="6" fill="#7ec98b"/>
<text x="90" y="44" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="21" fill="#7ec98b" text-anchor="middle" font-weight="600">press</text>
<line x1="790" y1="56" x2="790" y2="82" stroke="#e27270" stroke-width="2"/>
