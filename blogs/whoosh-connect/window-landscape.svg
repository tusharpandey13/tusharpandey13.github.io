<text x="780.0" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e27270" text-anchor="end" font-weight="400">ff 05 00 ea 05 — stopped</text>
<line x1="90" y1="144" x2="90" y2="151" stroke="#454e4e" stroke-width="1.4"/>
<line x1="230" y1="144" x2="230" y2="151" stroke="#454e4e" stroke-width="1.4"/>
