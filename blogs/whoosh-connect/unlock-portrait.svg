<text x="320.0" y="630.05" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="33" fill="#7ec98b" text-anchor="middle" font-weight="600">challenge left unanswered.</text>
<text x="320.0" y="663.05" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="33" fill="#7ec98b" text-anchor="middle" font-weight="600">The unlock was optional.</text>
