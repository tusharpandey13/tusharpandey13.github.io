<text x="320" y="478" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="26" fill="#e27270" text-anchor="middle" font-weight="700">×</text>
<text x="320" y="514" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="23" fill="#e27270" text-anchor="middle" font-weight="400">written back on 0003, every framing</text>
<text x="320" y="538" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="23" fill="#e27270" text-anchor="middle" font-weight="400">zero button frames, every time</text>
