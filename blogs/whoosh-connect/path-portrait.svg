<text x="310" y="508" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="21" fill="#808f8f" text-anchor="middle" font-weight="400">OpenBikeControl</text>
<text x="310" y="500" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="1" fill="#b5cbcb" text-anchor="start" font-weight="400"></text>
<rect x="24" y="576" width="572" height="96" rx="8" fill="#101616" stroke="#c7b982" stroke-width="1.2"/>
<text x="310.0" y="599.05" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="33" fill="#c7b982" text-anchor="middle" font-weight="600">One press opens about 50 s</text>
<text x="310.0" y="632.05" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="33" fill="#c7b982" text-anchor="middle" font-weight="600">of button frames — no unlock,</text>
<text x="310.0" y="665.05" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="33" fill="#c7b982" text-anchor="middle" font-weight="600">no account, no network.</text>
</svg>
