<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 700" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
<title id="t">The whole path, in three moves</title>
<desc id="d">Stacked: two BLE pucks on the bike, whoosh-connect on the Mac, and MyWhoosh on the other side of one OpenBikeControl device over mDNS and TCP.</desc>
<!-- whoosh-connect post figure, drawn by build/gen_figures.py.
     Palette: the owner's dark terminal scheme (bg #0e1212, ink #b5cbcb,
     headings #cfe7e8, muted #808f8f, amber #c7b982, teal #9acaca,
     green #7ec98b, red #e27270). All text >= 5:1 on the background. -->
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#c7b982"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7ec98b"/>
  </marker>
  <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#e27270"/>
  </marker>
</defs>
<rect width="620" height="700" fill="#0e1212"/>

<rect x="24" y="20" width="572" height="212" rx="12" fill="#101616" stroke="#303737" stroke-width="1.4" stroke-dasharray="6 6"/>
<text x="44" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#9acaca" text-anchor="start" font-weight="400" letter-spacing="1.4">ON THE BIKE</text>
<rect x="44" y="68" width="264" height="86" rx="12" fill="#141a1a" stroke="#303737" stroke-width="1.4"/>
<text x="62" y="100" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="28" fill="#cfe7e8" text-anchor="start" font-weight="600">Left puck</text>
<text x="62" y="130" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="26" fill="#808f8f" text-anchor="start" font-weight="400">− ◀ ▶ ▲ ▼</text>
<rect x="312" y="68" width="264" height="86" rx="12" fill="#141a1a" stroke="#303737" stroke-width="1.4"/>
<text x="330" y="100" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="28" fill="#cfe7e8" text-anchor="start" font-weight="600">Right puck</text>
<text x="330" y="130" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="26" fill="#808f8f" text-anchor="start" font-weight="400">+ A B Y Z</text>
<path d="M176 154 V182 H310 V268" fill="none" stroke="#c7b982" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M444 154 V182 H310" fill="none" stroke="#c7b982" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M310 182 V268" fill="none" stroke="#c7b982" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="324" y="258" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="23" fill="#c7b982" text-anchor="start" font-weight="400">Bluetooth LE</text>
<rect x="150" y="270" width="320" height="104" rx="12" fill="#141a1a" stroke="#454e4e" stroke-width="1.4"/>
<text x="310" y="308" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="30" fill="#cfe7e8" text-anchor="middle" font-weight="600">whoosh-connect</text>
<text x="310" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#808f8f" text-anchor="middle" font-weight="400">BLE → actions → OBC</text>
<text x="310" y="354" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="20" fill="#808f8f" text-anchor="middle" font-weight="400">one process, offline</text>
<path d="M310 374 V442" fill="none" stroke="#c7b982" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="326" y="414" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="23" fill="#c7b982" text-anchor="start" font-weight="400">mDNS + TCP</text>
<rect x="150" y="444" width="320" height="100" rx="12" fill="#141a1a" stroke="#454e4e" stroke-width="1.4"/>
