<text x="398" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#9acaca" text-anchor="start" font-weight="400" letter-spacing="1.4">ON THE MAC</text>
<rect x="750" y="60" width="226" height="240" rx="12" fill="#101616" stroke="#303737" stroke-width="1.4" stroke-dasharray="6 6"/>
<text x="768" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#9acaca" text-anchor="start" font-weight="400" letter-spacing="1.4">IN THE GAME</text>
