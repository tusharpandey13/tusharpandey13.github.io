<text x="500.0" y="346.95" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif" font-size="20" fill="#c7b982" text-anchor="middle" font-weight="600">One press opens about 50 s of button frames — no unlock, no account.</text>
