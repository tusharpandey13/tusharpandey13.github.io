<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">GhostLock on a Redmi A7 Pro 5G</title>
  <desc id="desc">A dark field-note cover with a phone outline, a lock, and the per-boot physical load formula.</desc>
  <rect width="1200" height="520" fill="#110e09"/>
  <rect x="1" y="1" width="1198" height="518" rx="28" fill="none" stroke="#2b2418"/>
  <g opacity=".35" stroke="#2b2418">
    <path d="M0 86h1200M0 172h1200M0 258h1200M0 344h1200M0 430h1200"/>
    <path d="M86 0v520M172 0v520M258 0v520M344 0v520M430 0v520M516 0v520M602 0v520M688 0v520M774 0v520M860 0v520M946 0v520M1032 0v520M1118 0v520"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="78" y="112" fill="#7fc16a" font-size="18" letter-spacing="4">GHOSTLOCK / FIELD NOTE</text>
    <text x="78" y="212" fill="#e0c9a5" font-size="76" font-weight="600">somalia</text>
    <text x="82" y="258" fill="#98886f" font-size="24">Redmi A7 Pro 5G · Unisoc T8300 · Android 16 · 6.6.118</text>
    <text x="82" y="340" fill="#d48993" font-size="18" letter-spacing="2">CVE-2026-43499</text>
    <text x="82" y="404" fill="#e0c9a5" font-size="30">0x80080000 + (tos &lt;&lt; 15)</text>
    <text x="82" y="444" fill="#98886f" font-size="18">the physical load is not a constant</text>
  </g>
  <g transform="translate(900 94)">
    <rect x="0" y="0" width="196" height="330" rx="30" fill="#17130d" stroke="#3a3021" stroke-width="2"/>
    <rect x="14" y="18" width="168" height="294" rx="20" fill="#0c0a07" stroke="#2b2418"/>
    <rect x="70" y="10" width="56" height="7" rx="3.5" fill="#2b2418"/>
    <g transform="translate(64 104)" fill="none" stroke="#7fc16a" stroke-width="3">
      <rect x="0" y="30" width="68" height="54" rx="8"/>
      <path d="M14 30V18a20 20 0 0 1 40 0v12"/>
      <circle cx="34" cy="55" r="5" fill="#7fc16a" stroke="none"/>
      <path d="M34 60v9" stroke-linecap="round"/>
    </g>
    <text x="98" y="230" text-anchor="middle" fill="#e0c9a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">uid 2000</text>
    <text x="98" y="254" text-anchor="middle" fill="#7fc16a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">→ uid 0</text>
    <text x="98" y="284" text-anchor="middle" fill="#98886f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">per boot</text>
  </g>
</svg>
