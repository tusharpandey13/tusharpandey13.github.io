<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Unisoc boot chain</title>
  <desc id="desc">SPL starts EDK2 and SprdBoot, TrustZone returns a byte, PCD31 becomes the physical kernel load and the KASLR seed.</desc>
  <rect width="1200" height="330" rx="20" fill="#110e09"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <g fill="#17130d" stroke="#3a3021">
      <rect x="28" y="98" width="150" height="78" rx="10"/>
      <rect x="216" y="98" width="190" height="78" rx="10"/>
      <rect x="444" y="98" width="160" height="78" rx="10"/>
      <rect x="642" y="98" width="160" height="78" rx="10"/>
      <rect x="840" y="98" width="160" height="78" rx="10"/>
      <rect x="1038" y="98" width="134" height="78" rx="10"/>
    </g>
    <g fill="#e0c9a5" text-anchor="middle">
      <text x="103" y="128">SPL</text><text x="103" y="150" fill="#98886f">slot B</text>
      <text x="311" y="128">EDK2</text><text x="311" y="150" fill="#98886f">SprdBoot.efi</text>
      <text x="524" y="128">TrustZone</text><text x="524" y="150" fill="#98886f">cmd 0x50</text>
      <text x="722" y="128">byte0</text><text x="722" y="150" fill="#98886f">reply</text>
      <text x="920" y="128">PCD31</text><text x="920" y="150" fill="#98886f">byte &lt;&lt; 15</text>
      <text x="1105" y="128">kernel</text><text x="1105" y="150" fill="#98886f">0x80080000+</text>
    </g>
    <g stroke="#7fc16a" stroke-width="2" fill="none">
      <path d="M178 137h22"/><path d="M406 137h22"/><path d="M604 137h22"/><path d="M802 137h22"/><path d="M1000 137h22"/>
    </g>
    <g fill="#7fc16a">
      <path d="M198 137l-9-6v12z"/><path d="M426 137l-9-6v12z"/><path d="M624 137l-9-6v12z"/><path d="M822 137l-9-6v12z"/><path d="M1020 137l-9-6v12z"/>
    </g>
    <path d="M920 176v50H740v22" fill="none" stroke="#d48993" stroke-width="2"/>
    <path d="M740 248l-6 9h12z" fill="#d48993"/>
    <text x="740" y="270" text-anchor="middle" fill="#d48993" font-size="14">/chosen/kaslr-seed</text>
    <text x="600" y="294" text-anchor="middle" fill="#98886f" font-size="13">the same byte picks the physical load and the virtual KASLR seed</text>
  </g>
</svg>
